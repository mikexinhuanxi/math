<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>烧结风箱数据相关性和弦图</title>
  <style>
    :root {
      --bg: #101418;
      --panel: rgba(255, 255, 255, 0.07);
      --panel-strong: rgba(255, 255, 255, 0.11);
      --text: #edf2f4;
      --muted: #9aa8b2;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #f2c14e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(46, 134, 171, 0.28), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(214, 73, 91, 0.2), transparent 28%),
        linear-gradient(135deg, #101418 0%, #151b20 48%, #0d1115 100%);
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      padding: 22px 26px 24px;
      gap: 16px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.055));
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 30px);
      letter-spacing: 0;
      font-weight: 780;
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      color: var(--text);
      background: var(--panel);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover {
      border-color: rgba(242, 193, 78, 0.7);
      background: var(--panel-strong);
      transform: translateY(-1px);
    }

    button.active {
      color: #111418;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        rgba(8, 12, 16, 0.52);
      background-size: 36px 36px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 26px 80px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: calc(100vh - 142px);
      min-height: 620px;
    }

    .stats {
      position: absolute;
      left: 18px;
      bottom: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .stat {
      min-width: 118px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(16, 20, 24, 0.76);
      backdrop-filter: blur(12px);
    }

    .stat b {
      display: block;
      color: var(--accent);
      font-size: 18px;
      line-height: 1.15;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .fallback {
      display: none;
      position: absolute;
      inset: 0;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(10, 14, 18, 0.86);
    }
  </style>
</head>

      <div>
        <h1>烧结风箱数据相关性和弦图</h1>
        <div class="sub">Spearman 相关系数 · 聚合工艺节点 · ECharts circular graph</div>
      </div>
      <nav class="controls" aria-label="视图切换">
        <button class="active" data-mode="core">核心强关系</button>
        <button data-mode="co">CO 关联</button>
        <button data-mode="all">全部关系</button>
      </nav>
    </header>

    <section class="canvas-wrap">
      <div id="chart"></div>
      <div class="stats">
        <div class="stat"><b id="edgeCount">0</b><span>当前连线</span></div>
        <div class="stat"><b id="maxCorr">0.00</b><span>最大 |r|</span></div>
        <div class="stat"><b id="coCount">0</b><span>CO 相关边</span></div>
      </div>
      <div id="fallback" class="fallback">ECharts 未加载。联网打开本页，或把 echarts.min.js 放到本文件同目录后再打开。</div>
    </section>
  </main>

    const categoryPalette = {
      "操作": "#4e79a7",
      "负压": "#59a14f",
      "温度": "#f28e2b",
      "大烟道": "#76b7b2",
      "输出": "#e15759"
    };
    const categoryIndex = {
      "操作": 0,
      "负压": 1,
      "温度": 2,
      "大烟道": 3,
      "输出": 4
    };
    const categories = Object.keys(categoryPalette).map(name => ({ name, itemStyle: { color: categoryPalette[name] } }));

    function selectLinks(mode) {
      if (mode === "co") {
        return payload.links
          .filter(d => d.group === "CO关联")
          .sort((a, b) => b.value - a.value);
      }
      if (mode === "all") {
        const strong = payload.links.filter(d => d.value >= 0.26);
        const co = payload.links.filter(d => d.group === "CO关联");
        const merged = new Map();
        [...strong, ...co].forEach(d => merged.set(`${d.source}->${d.target}`, d));
        return [...merged.values()].sort((a, b) => b.value - a.value).slice(0, 28);
      }
      return payload.links.filter(d => d.value >= 0.45).slice(0, 16);
    }

    function buildOption(mode) {
      const links = selectLinks(mode);
      const strength = new Map(payload.nodes.map(node => [node.name, 0]));
      links.forEach(link => {
        strength.set(link.source, (strength.get(link.source) || 0) + link.value);
        strength.set(link.target, (strength.get(link.target) || 0) + link.value);
      });

      const maxStrength = Math.max(...strength.values(), 1);
      const nodes = payload.nodes.map(node => {
        const ratio = (strength.get(node.name) || 0) / maxStrength;
        const isOutput = node.category === "输出";
        return {
          ...node,
          category: categoryIndex[node.category],
          symbolSize: isOutput ? 56 : 34 + ratio * 24,
          itemStyle: {
            color: categoryPalette[node.category],
            borderColor: "rgba(255,255,255,0.92)",
            borderWidth: isOutput ? 3 : 1.6,
            shadowBlur: 18,
            shadowColor: categoryPalette[node.category]
          },
          label: {
            color: "#edf2f4",
            fontSize: isOutput ? 15 : 13,
            fontWeight: isOutput ? 800 : 650
          }
        };
      });

      return {
        backgroundColor: "transparent",
        animationDuration: 900,
        animationEasingUpdate: "quinticInOut",
        color: Object.values(categoryPalette),
        tooltip: {
          trigger: "item",
          backgroundColor: "rgba(15, 19, 23, 0.94)",
          borderColor: "rgba(255,255,255,0.16)",
          textStyle: { color: "#edf2f4" },
          formatter(params) {
            if (params.dataType === "edge") {
              const d = params.data;
              const relation = d.corr >= 0 ? "正相关" : "负相关";
              return `<b>${d.source} → ${d.target}</b><br/>Spearman r：${d.corr.toFixed(4)}<br/>强度 |r|：${d.value.toFixed(4)}<br/>关系：${relation}`;
            }
            return `<b>${params.name}</b><br/>节点类别：${payload.nodes.find(n => n.name === params.name)?.category || ""}`;
          }
        },
        legend: {
          top: 18,
          left: 20,
          itemWidth: 12,
          itemHeight: 12,
          textStyle: { color: "#b7c2ca", fontSize: 12 },
          data: categories.map(c => c.name)
        },
        toolbox: {
          right: 22,
          top: 14,
          itemSize: 16,
          iconStyle: { borderColor: "#b7c2ca" },
          emphasis: { iconStyle: { borderColor: "#f2c14e" } },
          feature: {
            restore: {},
            saveAsImage: { name: `烧结风箱相关性和弦图_${mode}`, pixelRatio: 3, backgroundColor: "#101418" }
          }
        },
        series: [
          {
            name: "相关关系",
            type: "graph",
            layout: "circular",
            circular: { rotateLabel: true },
            top: 72,
            bottom: 52,
            left: 60,
            right: 60,
            roam: true,
            draggable: true,
            focusNodeAdjacency: true,
            categories,
            data: nodes,
            links: links.map(link => {
              const positive = link.corr >= 0;
              const width = Math.max(1.4, 1 + link.value * 10);
              return {
                ...link,
                lineStyle: {
                  color: positive ? "rgba(230, 87, 96, 0.78)" : "rgba(45, 156, 219, 0.82)",
                  width,
                  curveness: 0.28,
                  opacity: mode === "co" ? 0.84 : 0.68
                }
              };
            }),
            label: {
              show: true,
              position: "right",
              formatter: "{b}"
            },
            lineStyle: {
              cap: "round"
            },
            emphasis: {
              scale: true,
              lineStyle: {
                opacity: 1,
                width: 9
              },
              label: {
                color: "#ffffff"
              }
            }
          }
        ]
      };
    }

    const fallback = document.getElementById("fallback");
    if (!window.echarts) {
      fallback.style.display = "grid";
    } else {
      const chart = echarts.init(document.getElementById("chart"), "dark", { renderer: "canvas" });
      let currentMode = "core";

      function render(mode) {
        currentMode = mode;
        const links = selectLinks(mode);
        chart.setOption(buildOption(mode), true);
        document.getElementById("edgeCount").textContent = links.length;
        document.getElementById("maxCorr").textContent = Math.max(...links.map(d => d.value), 0).toFixed(2);
        document.getElementById("coCount").textContent = links.filter(d => d.group === "CO关联").length;
      }

      document.querySelectorAll("button[data-mode]").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelectorAll("button[data-mode]").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
          render(button.dataset.mode);
        });
      });

      window.addEventListener("resize", () => chart.resize());
      render(currentMode);
    }
  </script>
</body>
</html>
